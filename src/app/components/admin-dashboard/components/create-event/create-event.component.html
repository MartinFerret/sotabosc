<p-toast></p-toast>

<section class="form-wrapper">
  <p-card>
    <ng-template pTemplate="title">
      <h2 class="form-title">Crea nou event</h2>
    </ng-template>

    <form [formGroup]="eventForm">
      <div class="form-grid">
        <span class="p-float-label input">
          <input pInputText id="title" [formControl]="eventForm.controls.title" />
          <label for="title">{{ "ADMIN.FORM.TITLE" | translate }}</label>
        </span>

        <span class="p-float-label input">
          <textarea pInputTextarea rows="5" id="description" [formControl]="eventForm.controls.description"></textarea>
          <label for="description">{{ "ADMIN.FORM.DESCRIPTION" | translate }} *</label>
        </span>

        <span class="p-float-label input">
          <input pInputText id="hour" [formControl]="eventForm.controls.hour" />
          <label for="hour">{{ "ADMIN.FORM.HOUR" | translate }}</label>
        </span>

        <span class="p-float-label input">
          <input pInputText id="date" [formControl]="eventForm.controls.date" />
          <label for="date">{{ "ADMIN.FORM.DATE" | translate }} *</label>
        </span>

        <span class="p-float-label input">
          <p-inputNumber id="price" [formControl]="eventForm.controls.price"></p-inputNumber>
          <label for="price">{{ "ADMIN.FORM.PRICE" | translate }}</label>
        </span>

        <span class="p-float-label input">
          <input pInputText id="googleFormLink" [formControl]="eventForm.controls.googleFormLink" />
          <label for="googleFormLink">{{ "ADMIN.FORM.GOOGLE_LINK" | translate }}</label>
        </span>

        <div class="switch">
          <label for="isOpen">{{ "ADMIN.FORM.STATUS" | translate }} *</label>
          <p-inputSwitch id="isOpen" [formControl]="eventForm.controls.isOpen"></p-inputSwitch>
        </div>

        <div class="upload">
          <p-fileUpload
            mode="basic"
            [chooseLabel]="'ADMIN.FORM.UPLOAD_IMAGE' | translate"
            name="demo[]"
            url="https://www.primefaces.org/cdn/api/upload.php"
            accept="image/*"
            [maxFileSize]="1000000"
            (onUpload)="onUpload($event)"
            (onSelect)="onImageSelect($event)"
            styleClass="p-button-outlined"
            [auto]="true"
          ></p-fileUpload>
          <div *ngIf="previewImage" class="image-preview">
            <img [src]="previewImage" alt="Preview" style="max-width: 100%; max-height: 300px;" />
          </div>
        </div>
      </div>

      <div class="submit-btn">
        <p-button
          [label]="'GLOBAL.CREATE' | translate"
          (click)="createEvent()"
          styleClass="p-button-rounded p-button-lg p-button-success"
        ></p-button>
      </div>
    </form>
  </p-card>
</section>
